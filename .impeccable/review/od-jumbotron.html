
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MakeItGueznet — salon privé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0c10;
      --surface: oklch(16% 0.012 250);
      --fg: #e8edf2;
      --muted: oklch(72% 0.018 250);
      --border: oklch(32% 0.014 250);
      --accent: #c8f542;
      --accent-press: oklch(82% 0.19 122);
      --amber: #f5c518;
      --danger: oklch(64% 0.18 25);
      --bezel: oklch(14% 0.01 250);
      --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
      --font-body: "Barlow", "Avenir Next", "Segoe UI", sans-serif;
      --mesh: radial-gradient(oklch(100% 0 0 / 0.045) 0.55px, transparent 0.7px);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { background: var(--bg); }
    body {
      min-height: 100dvh;
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: 0;
      background:
        radial-gradient(ellipse 80% 42% at 50% -10%, oklch(22% 0.02 250) 0%, transparent 58%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 28px 20px 40px;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    img, svg { max-width: 100%; display: block; }
    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 3px;
    }
    ::selection { background: var(--amber); color: var(--bg); }

    .arena { width: min(1120px, 100%); }
    .cabinet {
      background: linear-gradient(180deg, oklch(22% 0.012 250) 0%, oklch(13% 0.01 250) 42%, oklch(11% 0.008 250) 100%);
      padding: 14px 14px 0;
      border-radius: 12px;
      box-shadow:
        0 0 0 1px oklch(50% 0.01 250 / 0.28),
        0 28px 80px oklch(0% 0 0 / 0.55),
        inset 0 1px 0 oklch(100% 0 0 / 0.1);
    }
    .bezel {
      background: var(--bezel);
      padding: 9px;
      border-radius: 5px;
      box-shadow:
        inset 0 0 0 1px oklch(100% 0 0 / 0.06),
        inset 0 18px 40px oklch(0% 0 0 / 0.35);
      position: relative;
    }
    .ir {
      position: absolute;
      top: 4px;
      right: 22px;
      width: 28px;
      height: 4px;
      border-radius: 2px;
      background: oklch(8% 0.01 250);
      box-shadow: inset 0 1px 1px oklch(100% 0 0 / 0.15);
    }
    .led {
      position: relative;
      background-color: var(--bg);
      background-image: var(--mesh);
      background-size: 3px 3px;
      min-height: min(760px, calc(100dvh - 120px));
      overflow: hidden;
    }
    .stage { position: relative; z-index: 1; min-height: inherit; display: flex; flex-direction: column; }
    .plinth {
      height: 22px;
      margin: 0 48px;
      background: linear-gradient(180deg, oklch(18% 0.01 250), oklch(10% 0.008 250));
      clip-path: polygon(4% 0, 96% 0, 100% 100%, 0 100%);
      box-shadow: 0 10px 24px oklch(0% 0 0 / 0.45);
      position: relative;
    }
    .plinth::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: oklch(40% 0.01 250);
      transform: translateX(-50%);
    }

    .kicker {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .display {
      font-family: var(--font-display);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    .caps {
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .muted { color: var(--muted); }
    .amber { color: var(--amber); font-family: var(--font-display); font-weight: 700; letter-spacing: 0.12em; font-variant-numeric: tabular-nums; }
    .clock {
      color: var(--amber);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .clock .colon { animation: blink 1.2s steps(2) infinite; }

    .strip {
      display: flex;
      align-items: center;
      gap: 12px 16px;
      flex-wrap: wrap;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      min-height: 56px;
    }
    .strip.is-live .round {
      color: var(--accent);
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 15px;
    }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 13px;
    }
    .live i {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      animation: blink 1.4s steps(2) infinite;
    }
    .strip .spacer { flex: 1; }

    .pad { padding: 22px 22px 28px; }
    .fill { flex: 1; display: flex; flex-direction: column; }

    .btn {
      appearance: none;
      border: 1px solid transparent;
      min-height: 44px;
      padding: 12px 22px;
      border-radius: 2px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.38; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent);
      color: var(--bg);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-press);
      color: var(--bg);
    }
    .btn-ghost {
      background: transparent;
      color: var(--fg);
      border-color: var(--border);
    }
    .btn-ghost:hover:not(:disabled) {
      background: oklch(24% 0.014 250);
      color: var(--fg);
      border-color: var(--fg);
    }
    .btn-danger {
      background: transparent;
      color: var(--fg);
      border-color: var(--border);
      min-width: 44px;
      padding: 10px;
    }
    .btn-danger:hover:not(:disabled) {
      background: oklch(28% 0.06 25);
      color: var(--fg);
      border-color: var(--danger);
    }
    .btn-wide { width: 100%; }

    .field { display: grid; gap: 8px; }
    .field label {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .slot, select.slot {
      background: oklch(12% 0.01 250);
      border: 1px solid var(--border);
      border-radius: 2px;
      min-height: 48px;
      padding: 10px 14px;
      color: var(--fg);
      width: 100%;
    }
    .slot:hover, select.slot:hover { border-color: oklch(50% 0.014 250); }
    .slot:focus-visible, select.slot:focus-visible {
      border-color: var(--fg);
      outline-offset: 0;
    }
    .slot-code {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-align: center;
      color: var(--amber);
    }
    .hint { font-size: 13px; letter-spacing: 0.01em; color: var(--muted); max-width: 42ch; }

    .home {
      flex: 1;
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
      padding: 48px 24px 56px;
      gap: 18px;
    }
    .wordmark {
      font-family: var(--font-display);
      font-size: clamp(40px, 10vw, 72px);
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.08;
      margin: 0;
    }
    .home-form {
      width: min(420px, 100%);
      display: grid;
      gap: 16px;
      text-align: left;
      margin-top: 12px;
    }

    .lobby {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 0;
      flex: 1;
    }
    .col { padding: 20px 22px 24px; }
    .col + .col { border-left: 1px solid var(--border); }
    .section-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.015em;
      margin: 0 0 14px;
    }
    .roster { display: grid; gap: 8px; }
    .player {
      display: grid;
      grid-template-columns: 10px 1fr auto;
      gap: 12px;
      align-items: center;
      min-height: 48px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--fg); }
    .pip.wait { background: var(--muted); }
    .role {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: var(--font-display);
      font-weight: 700;
    }
    .settings { display: grid; gap: 14px; }
    .drop {
      border: 1px dashed var(--border);
      min-height: 88px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 16px;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.01em;
    }
    .drop.is-over { border-color: var(--fg); color: var(--fg); background: oklch(20% 0.014 250); }
    .pool-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-size: 14px;
    }
    .host-actions { display: grid; gap: 10px; margin-top: 18px; }
    .wait-copy { max-width: 36ch; }

    .media-stage {
      position: relative;
      background: oklch(10% 0.01 250);
      overflow: hidden;
      flex: 1;
      min-height: 280px;
      display: grid;
      place-items: center;
    }
    .media-stage svg, .media-stage img {
      width: 100%;
      height: 100%;
      max-height: 58dvh;
      object-fit: contain;
      aspect-ratio: 16 / 10;
    }
    .media-stage.is-frozen {
      box-shadow: inset 0 0 0 2px var(--fg);
    }
    .media-stage.is-frozen svg, .media-stage.is-frozen img { filter: saturate(0.82) contrast(1.05); }
    .overlay-input {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 16%;
      width: 84%;
      text-align: center;
      background: transparent;
      border: 0;
      resize: none;
      min-height: 52px;
      font-family: var(--font-display);
      font-size: clamp(22px, 3.6vw, 40px);
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.15;
      color: var(--fg);
      text-shadow: 0 2px 0 #000, 2px 2px 0 #000, 0 0 10px #000;
    }
    .overlay-input::placeholder { color: oklch(85% 0.01 250 / 0.7); text-transform: uppercase; }
    .scrim {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 38%;
      background: linear-gradient(transparent, oklch(0% 0 0 / 0.45));
      pointer-events: none;
    }
    .nameplate {
      position: absolute;
      left: 12px;
      bottom: 12px;
      max-width: calc(100% - 24px);
      background: oklch(12% 0.02 250 / 0.94);
      border: 1px solid var(--fg);
      padding: 8px 14px 10px;
      box-shadow: 0 10px 28px oklch(0% 0 0 / 0.45);
      transform: translateY(120%);
      opacity: 0;
    }
    .nameplate.is-in { animation: slam 0.22s cubic-bezier(0.15, 0.9, 0.25, 1) forwards; }
    .nameplate .kicker { color: var(--fg); }
    .nameplate strong {
      display: block;
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.015em;
      line-height: 1.1;
    }
    .cta-bar { padding: 14px 18px 20px; border-top: 1px solid var(--border); }

    .vote-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 16px 18px 8px;
    }
    .card {
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .card .thumb {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: oklch(10% 0.01 250);
    }
    .card .thumb svg, .card .thumb img { width: 100%; height: 100%; object-fit: contain; }
    .card .cap {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 10px;
      text-align: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1.15;
      color: var(--fg);
      text-shadow: 0 1px 0 #000, 1px 1px 0 #000, 0 0 8px #000;
    }
    .card-body { padding: 10px 12px 12px; display: grid; gap: 8px; }
    .combo {
      justify-self: start;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid var(--fg);
      padding: 4px 8px;
      color: var(--fg);
    }
    .stars { display: flex; gap: 4px; }
    .star {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 2px;
    }
    .star:hover { background: oklch(24% 0.014 250); color: var(--fg); }
    .star.is-on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .star:disabled { opacity: 0.35; }
    .own-wait { font-size: 13px; color: var(--muted); letter-spacing: 0.01em; }

    .board { display: grid; gap: 8px; padding: 16px 18px 8px; }
    .row {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      gap: 12px;
      align-items: center;
      min-height: 64px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      text-align: left;
      width: 100%;
      color: var(--fg);
    }
    .row:hover { background: oklch(22% 0.014 250); color: var(--fg); border-color: oklch(50% 0.014 250); }
    .rank {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .score {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .row .who { font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }
    .spread {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 8px 18px 12px;
    }
    .still {
      position: relative;
      border: 1px solid var(--border);
      background: oklch(10% 0.01 250);
      cursor: pointer;
      padding: 0;
      color: inherit;
      aspect-ratio: 16 / 10;
      overflow: hidden;
    }
    .still:hover { border-color: var(--fg); }
    .still svg, .still img { width: 100%; height: 100%; object-fit: contain; }
    .still.is-frozen { box-shadow: inset 0 0 0 2px var(--fg); }
    .reveal-stage { position: relative; margin: 0 18px 8px; border: 1px solid var(--border); }

    .lib-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      padding: 8px 0 16px;
    }
    .lib-item { border: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; }
    .lib-item .thumb { aspect-ratio: 16 / 10; overflow: hidden; }
    .lib-item .thumb svg, .lib-item .thumb img { width: 100%; height: 100%; object-fit: contain; }
    .lib-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px;
      font-size: 13px;
    }
    .tag {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-family: var(--font-display);
      font-weight: 700;
    }
    .empty {
      border: 1px dashed var(--border);
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
    }

    @keyframes blink { 50% { opacity: 0.2; } }
    @keyframes slam {
      0% { transform: translateY(110%) rotate(-1.2deg); opacity: 0; }
      62% { transform: translateY(-5%) rotate(0.4deg); opacity: 1; }
      100% { transform: translateY(0) rotate(0); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .live i, .clock .colon { animation: none; }
      .nameplate.is-in { animation: none; transform: none; opacity: 1; }
      .btn { transition: none; }
    }
    @media (max-width: 820px) {
      body { padding: 0; }
      .cabinet { border-radius: 0; min-height: 100dvh; padding: 8px 8px 0; }
      .led { min-height: calc(100dvh - 36px); }
      .plinth { margin: 0 24px; }
      .lobby { grid-template-columns: 1fr; }
      .col + .col { border-left: 0; border-top: 1px solid var(--border); }
      .vote-grid, .spread { grid-template-columns: 1fr 1fr; }
      .home { padding: 32px 16px 40px; }
    }
    @media (max-width: 560px) {
      .vote-grid, .spread { grid-template-columns: 1fr; }
      .stars { justify-content: space-between; }
      .row { grid-template-columns: 36px 1fr auto; }
      .pad, .col { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="arena" data-od-id="arena">
    <div class="cabinet" data-od-id="jumbotron-cabinet">
      <div class="bezel">
        <span class="ir" aria-hidden="true"></span>
        <div class="led">
          <div class="stage" id="stage" data-od-id="app"></div>
        </div>
      </div>
      <div class="plinth" aria-hidden="true"></div>
    </div>
  </div>

  <script>
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function plate(inner, label) {
      return `<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label} — média synthétique">
        <rect width="800" height="500" fill="#141820"/>
        ${inner}
        <rect x="0" y="470" width="800" height="30" fill="#0a0c10"/>
        <text x="16" y="490" fill="#9aa3b0" font-family="Barlow,sans-serif" font-size="13" letter-spacing="1.6">MÉDIA SYNTHÉTIQUE — ${label}</text>
      </svg>`;
    }

    const SCENES = [
      {
        id: "vase", kind: "image", tag: "animaux", title: "Le vase",
        svg: plate(`<rect width="800" height="318" fill="#1c2430"/><rect x="560" y="36" width="80" height="170" fill="#3d4d62"/><rect y="318" width="800" height="182" fill="#252b36"/><rect x="70" y="338" width="300" height="16" fill="#3a3128"/><g transform="rotate(-26 210 280)"><path d="M186 168h52l22 176h-96z" fill="#c9b08a"/><ellipse cx="212" cy="168" rx="32" ry="12" fill="#d8c7a4"/></g><ellipse cx="348" cy="318" rx="78" ry="34" fill="#2a2624"/><ellipse cx="348" cy="258" rx="52" ry="40" fill="#2a2624"/><polygon points="318,232 328,196 346,236" fill="#2a2624"/><polygon points="360,234 392,194 382,238" fill="#2a2624"/><circle cx="334" cy="254" r="4" fill="#e8edf2"/><circle cx="368" cy="254" r="4" fill="#e8edf2"/>`, "Le vase")
      },
      {
        id: "bbq", kind: "image", tag: "quotidien", title: "Le barbecue",
        svg: plate(`<rect width="800" height="500" fill="#1a2220"/><rect y="300" width="800" height="200" fill="#2a332c"/><rect x="220" y="250" width="360" height="28" fill="#3a3a3a"/><rect x="250" y="278" width="300" height="90" fill="#2c2c2c"/><rect x="270" y="236" width="260" height="14" fill="#6a7180"/><g fill="#f5c518" opacity=".85"><ellipse cx="340" cy="210" rx="18" ry="40"/><ellipse cx="400" cy="190" rx="22" ry="56"/><ellipse cx="458" cy="214" rx="16" ry="36"/></g><circle cx="620" cy="320" r="36" fill="#3a3128"/><rect x="604" y="350" width="32" height="70" fill="#3a3128"/>`, "Le barbecue")
      },
      {
        id: "chaise", kind: "image", tag: "quotidien", title: "La chaise",
        svg: plate(`<rect width="800" height="500" fill="#20242c"/><rect x="80" y="80" width="220" height="140" fill="#3a4658"/><rect y="360" width="800" height="140" fill="#2a2e36"/><g transform="rotate(28 420 300)"><rect x="340" y="180" width="160" height="22" fill="#6b5a48"/><rect x="354" y="202" width="132" height="90" fill="#c4b49a"/><rect x="368" y="292" width="18" height="80" fill="#4a4036"/><rect x="454" y="292" width="18" height="80" fill="#4a4036"/></g><rect x="560" y="300" width="90" height="12" fill="#e8edf2" opacity=".35"/>`, "La chaise")
      },
      {
        id: "chien", kind: "gif", tag: "animaux", title: "Au volant",
        svg: plate(`<rect width="800" height="500" fill="#1b2028"/><rect x="90" y="210" width="620" height="200" fill="#2c3340"/><rect x="120" y="240" width="240" height="110" fill="#6a93b0" opacity=".45"/><rect x="430" y="260" width="220" height="70" fill="#11141a"/><g><ellipse cx="400" cy="250" rx="70" ry="48" fill="#5a4638"><animateTransform attributeName="transform" type="rotate" values="-6 400 268; 6 400 268; -6 400 268" dur="0.45s" repeatCount="indefinite"/></ellipse><ellipse cx="400" cy="320" rx="90" ry="50" fill="#5a4638"/><polygon points="340,220 350,186 372,224" fill="#5a4638"/><polygon points="430,220 458,184 446,226" fill="#5a4638"/></g><rect x="0" y="400" width="800" height="70" fill="#11141a"/>`, "Au volant · GIF")
      },
      {
        id: "gateau", kind: "image", tag: "absurde", title: "Le gâteau",
        svg: plate(`<rect width="800" height="500" fill="#241c22"/><rect y="330" width="800" height="170" fill="#2c2430"/><rect x="250" y="250" width="300" height="90" fill="#e8edf2"/><rect x="270" y="200" width="260" height="60" fill="#d7c4c8"/><g fill="#f5c518"><rect x="310" y="150" width="8" height="52"/><rect x="396" y="132" width="8" height="70"/><rect x="482" y="150" width="8" height="52"/></g><g fill="#c8f542" opacity=".9"><circle cx="314" cy="146" r="7"/><circle cx="400" cy="128" r="8"/><circle cx="486" cy="146" r="7"/></g>`, "Le gâteau")
      }
    ];

    const NPC = {
      vase:  { marc: "Préavis déposé dans le tapis", ines: "Chute libre, dignité intacte", yanis: "Chute libre, clause de dignité", combo: ["ines", "yanis"] },
      bbq:   { marc: "Le feu a demandé un deuxième avis", ines: "Saison 4 de la saucisse", yanis: "Personne ne surveille la grille", combo: [] },
      chaise:{ marc: "Réunion terminée, chaise aussi", ines: "Le dossier n'a pas suivi", yanis: "Sortie de piste, open space", combo: [] },
      chien: { marc: "Permis validé par le nez", ines: "Regarde la route, Kevin", yanis: "Régulateur : la langue", combo: [] },
      gateau:{ marc: "Les bougies ont pris le pouvoir", ines: "Anniversaire en code rouge", yanis: "Souffle plus fort, pas assez", combo: [] }
    };

    const NPC_STARS = {
      self: { marc: 4, ines: 5, yanis: 4 },
      marc: { self: 4, ines: 3, yanis: 4 },
      ines: { self: 5, marc: 3, yanis: 5 },
      yanis:{ self: 4, marc: 4, ines: 5 }
    };

    const state = {
      view: "home",
      nickname: "",
      code: "",
      isHost: true,
      catalogue: "tous",
      captionSecs: 45,
      rounds: 5,
      round: 1,
      remaining: 45,
      draft: "",
      submitted: false,
      votes: {},
      revealed: "",
      matchOver: false,
      library: SCENES.map((s) => ({ ...s, synthetic: true })),
      timer: null,
      guestArmed: false
    };

    try {
      const nick = localStorage.getItem("mig-nick");
      if (nick) state.nickname = nick;
    } catch (e) {}

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function pool() {
      const f = state.catalogue;
      if (f === "tous") return state.library;
      return state.library.filter((i) => i.tag === f);
    }
    function currentMedia() {
      const p = pool();
      if (!p.length) return state.library[0];
      return p[(state.round - 1) % p.length];
    }
    function codeLabel() {
      return (state.code || "····").padEnd(4, "·");
    }
    function players() {
      const me = { id: "self", name: state.nickname || "Toi", host: state.isHost };
      const marc = { id: "marc", name: "Marc", host: !state.isHost };
      const ines = { id: "ines", name: "Inès", host: false };
      const yanis = { id: "yanis", name: "Yanis", host: false };
      return state.isHost ? [me, marc, ines, yanis] : [marc, me, ines, yanis];
    }
    function submissions() {
      const media = currentMedia();
      const lines = NPC[media.id] || NPC.vase;
      return [
        { id: "self", name: state.nickname, text: state.draft, own: true, combo: false },
        { id: "marc", name: "Marc", text: lines.marc, own: false, combo: lines.combo.includes("marc") },
        { id: "ines", name: "Inès", text: lines.ines, own: false, combo: lines.combo.includes("ines") },
        { id: "yanis", name: "Yanis", text: lines.yanis, own: false, combo: lines.combo.includes("yanis") }
      ];
    }
    function totals() {
      const ids = ["self", "marc", "ines", "yanis"];
      const t = {};
      ids.forEach((id) => {
        let n = 0;
        ids.forEach((from) => {
          if (from === id) return;
          if (from === "self") n += Number(state.votes[id] || 0);
          else n += NPC_STARS[from][id] || 0;
        });
        t[id] = n;
      });
      return t;
    }
    function ranked() {
      const subs = submissions();
      const t = totals();
      return subs.map((s) => ({ ...s, score: t[s.id] })).sort((a, b) => b.score - a.score || a.id.localeCompare(b.id));
    }

    function stopTimer() {
      if (state.timer) { clearInterval(state.timer); state.timer = null; }
    }
    function startTimer() {
      stopTimer();
      state.remaining = state.captionSecs;
      state.timer = setInterval(() => {
        state.remaining -= 1;
        const clock = document.querySelector("[data-od-id='caption-clock']");
        if (clock) clock.innerHTML = fmtTime(state.remaining);
        if (state.remaining <= 0) {
          stopTimer();
          if (!state.submitted) {
            if (!state.draft.trim()) state.draft = "…";
            state.submitted = true;
          }
          go("vote");
        }
      }, 1000);
    }
    function fmtTime(s) {
      s = Math.max(0, s);
      const m = String(Math.floor(s / 60)).padStart(2, "0");
      const sec = String(s % 60).padStart(2, "0");
      return `${m}<span class="colon">:</span>${sec}`;
    }
    function go(view) {
      if (view !== "caption") stopTimer();
      state.view = view;
      if (view === "caption") {
        state.submitted = false;
        state.draft = "";
        state.votes = {};
        state.revealed = "";
        startTimer();
      }
      if (view === "scores") state.revealed = "";
      render();
      if (view === "scores") requestAnimationFrame(rerank);
    }

    function homeCta() {
      const nick = state.nickname.trim();
      const c = state.code.trim();
      if (!nick) return { label: "Entrer", disabled: true };
      if (!c) return { label: "Nouvelle salle", disabled: false };
      if (c.length === 4) return { label: "Rejoindre", disabled: false };
      return { label: "Entrer", disabled: true };
    }

    function iconStar(on) {
      return `<svg width="18" height="18" viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.7"><polygon points="12 3 14.8 9.2 21.5 9.8 16.4 14.2 18 20.8 12 17.2 6 20.8 7.6 14.2 2.5 9.8 9.2 9.2"/></svg>`;
    }
    function iconX() {
      return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
    }

    function mediaBox(item, extraClass, overlay) {
      const inner = item.url
        ? `<img src="${esc(item.url)}" alt="${esc(item.title)} — import local" width="800" height="500" />`
        : item.svg;
      return `<div class="media-stage ${extraClass || ""}" data-od-id="media-stage">${inner}${overlay || ""}</div>`;
    }

    function renderHome() {
      const cta = homeCta();
      return `<section class="home" data-od-id="home">
        <p class="kicker" data-od-id="home-kicker">Salon privé</p>
        <h1 class="wordmark" data-od-id="home-title">MakeItGueznet</h1>
        <p class="muted" style="max-width:36ch;margin:0">Légendes sur l'image. Votes à l'aveugle. Tableau dans le salon.</p>
        <form class="home-form" data-od-id="home-form" data-action="enter">
          <div class="field">
            <label for="nick">Pseudo</label>
            <input class="slot" id="nick" data-od-id="nickname-input" name="nick" maxlength="16" autocomplete="nickname" placeholder="Ton nom dans le salon" value="${esc(state.nickname)}" />
          </div>
          <div class="field">
            <label for="code">Code salle · 4 lettres</label>
            <input class="slot slot-code" id="code" data-od-id="room-code-input" name="code" maxlength="4" spellcheck="false" autocomplete="off" placeholder="····" value="${esc(state.code)}" />
          </div>
          <p class="hint">Quatre lettres d'un salon déjà allumé. Vide pour ouvrir le tien.</p>
          <button class="btn btn-primary btn-wide" data-od-id="home-cta" ${cta.disabled ? "disabled" : ""}>${cta.label}</button>
        </form>
      </section>`;
    }

    function renderLobby() {
      const list = players().map((p) => `<div class="player" data-od-id="player-${p.id}">
        <span class="pip"></span>
        <span>${esc(p.name)}${p.id === "self" ? " <span class='muted'>(toi)</span>" : ""}</span>
        <span class="role">${p.host ? "Hôte" : "Prêt"}</span>
      </div>`).join("");
      const n = pool().length;
      const host = state.isHost;
      const settings = host ? `<div class="settings" data-od-id="host-settings">
          <div class="field">
            <label for="cat">Filtre catalogue</label>
            <select class="slot" id="cat" data-od-id="catalogue-filter">
              <option value="tous"${state.catalogue === "tous" ? " selected" : ""}>Tous les visuels</option>
              <option value="animaux"${state.catalogue === "animaux" ? " selected" : ""}>Animaux</option>
              <option value="quotidien"${state.catalogue === "quotidien" ? " selected" : ""}>Quotidien</option>
              <option value="absurde"${state.catalogue === "absurde" ? " selected" : ""}>Absurde</option>
            </select>
          </div>
          <div class="field">
            <label for="secs">Secondes de légende</label>
            <select class="slot" id="secs" data-od-id="caption-seconds">
              ${[30, 45, 60].map((v) => `<option value="${v}"${state.captionSecs === v ? " selected" : ""}>${v} s</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label for="rounds">Nombre de manches</label>
            <select class="slot" id="rounds" data-od-id="round-count">
              ${[3, 5, 7].map((v) => `<option value="${v}"${state.rounds === v ? " selected" : ""}>${v}</option>`).join("")}
            </select>
          </div>
          <div class="drop" data-od-id="lobby-drop" data-drop="1">Dépose images ou GIF<br /><span class="tag">PNG · JPG · GIF</span></div>
          <div class="pool-line"><span>Réservoir</span><strong data-od-id="pool-count">${n} visuel${n > 1 ? "s" : ""}</strong></div>
          <div class="host-actions">
            <button type="button" class="btn btn-ghost btn-wide" data-od-id="open-library" data-go="library">Bibliothèque</button>
            <button type="button" class="btn btn-primary btn-wide" data-od-id="start-match" data-action="start" ${n ? "" : "disabled"}>Démarrer</button>
            ${n ? "" : `<p class="hint">Réservoir vide — importe un visuel.</p>`}
          </div>
        </div>` : `<div data-od-id="guest-wait">
          <p class="wait-copy">Marc prépare le jumbotron. Les commandes restent côté hôte. Tu restes dans la pièce.</p>
          <p class="hint" style="margin-top:12px">La manche s'ouvre toute seule dès que l'écran bascule.</p>
        </div>`;
      return `<section class="fill" data-od-id="lobby">
        <div class="strip" data-od-id="lobby-strip">
          <span class="kicker">Salon</span>
          <span class="amber" data-od-id="lobby-code">${esc(codeLabel())}</span>
          <span class="spacer"></span>
          <span class="muted caps" style="font-size:12px">En attente</span>
        </div>
        <div class="lobby">
          <div class="col">
            <h2 class="section-title" data-od-id="roster-title">Joueurs</h2>
            <div class="roster" data-od-id="player-roster">${list}</div>
          </div>
          <div class="col">
            <h2 class="section-title" data-od-id="settings-title">${host ? "Réglages hôte" : "Invité"}</h2>
            ${settings}
          </div>
        </div>
      </section>`;
    }

    function renderCaption() {
      const media = currentMedia();
      const overlay = `<div class="scrim"></div>
        <label class="visually-hidden" for="cap" style="position:absolute;left:-999px">Légende</label>
        <textarea class="overlay-input" id="cap" data-od-id="caption-input" maxlength="80" rows="2" placeholder="Écris sur l'image…">${esc(state.draft)}</textarea>`;
      return `<section class="fill" data-od-id="caption">
        <div class="strip is-live" data-od-id="caption-strip">
          <span class="live" data-od-id="live-pip"><i></i> Live</span>
          <span class="round" data-od-id="round-label">Manche ${state.round} / ${state.rounds}</span>
          <span class="spacer"></span>
          <div class="clock" data-od-id="caption-clock" aria-live="polite">${fmtTime(state.remaining)}</div>
        </div>
        ${mediaBox(media, "", overlay)}
        <div class="cta-bar">
          <button class="btn btn-primary btn-wide" data-od-id="send-caption" data-action="send" ${state.draft.trim() ? "" : "disabled"}>Envoyer</button>
        </div>
      </section>`;
    }

    function renderVote() {
      const media = currentMedia();
      const cards = submissions().map((s) => {
        const overlayCap = `<div class="cap">${esc(s.text || "…")}</div>`;
        const body = s.own
          ? `<p class="own-wait">Ton envoi — hors vote. En attente du dépouillement.</p>`
          : `<div class="stars" data-od-id="stars-${s.id}">${[1,2,3,4,5].map((n) => {
              const on = Number(state.votes[s.id] || 0) >= n;
              return `<button type="button" class="star ${on ? "is-on" : ""}" data-od-id="star-${s.id}-${n}" data-vote="${s.id}" data-n="${n}" aria-label="${n} étoile${n > 1 ? "s" : ""} pour une légende anonyme">${iconStar(on)}</button>`;
            }).join("")}</div>`;
        return `<article class="card" data-od-id="vote-card-${s.id}">
          <div class="thumb">${media.url ? `<img src="${esc(media.url)}" alt="" width="800" height="500">` : media.svg}${overlayCap}</div>
          <div class="card-body">
            ${s.combo ? `<span class="combo" data-od-id="combo-${s.id}">Combo</span>` : `<span class="tag">${s.own ? "Toi" : "Anonyme"}</span>`}
            ${body}
          </div>
        </article>`;
      }).join("");
      const ready = ["marc", "ines", "yanis"].every((id) => state.votes[id]);
      return `<section class="fill" data-od-id="vote">
        <div class="strip is-live" data-od-id="vote-strip">
          <span class="live"><i></i> Live</span>
          <span class="round">Vote à l'aveugle · manche ${state.round}/${state.rounds}</span>
        </div>
        <div class="vote-grid" data-od-id="vote-grid">${cards}</div>
        <div class="cta-bar">
          <button class="btn btn-primary btn-wide" data-od-id="confirm-votes" data-action="confirm-votes" ${ready ? "" : "disabled"}>Valider les étoiles</button>
        </div>
      </section>`;
    }

    function renderScores() {
      const media = currentMedia();
      const last = state.round >= state.rounds;
      const rows = ranked().map((s, i) => `<button type="button" class="row" data-od-id="score-row-${s.id}" data-reveal="${s.id}">
        <span class="rank">${i + 1}</span>
        <span>
          <strong>${esc(s.text || "…")}</strong>
          <div class="who">${state.revealed === s.id ? esc(s.name) : "Auteur caché — tape pour figer"}</div>
        </span>
        <span class="score">${s.score}<span class="muted" style="font-size:12px;letter-spacing:.08em;margin-left:6px">★</span></span>
      </button>`).join("");
      const stills = ranked().map((s) => `<button type="button" class="still ${state.revealed === s.id ? "is-frozen" : ""}" data-od-id="still-${s.id}" data-reveal="${s.id}" aria-label="Révéler l'auteur de cette légende">
        ${media.url ? `<img src="${esc(media.url)}" alt="" width="800" height="500">` : media.svg}
      </button>`).join("");
      const focus = ranked().find((s) => s.id === state.revealed);
      const plate = focus ? `<div class="reveal-stage media-stage is-frozen" data-od-id="reveal-frame">
        ${media.url ? `<img src="${esc(media.url)}" alt="" width="800" height="500">` : media.svg}
        <div class="scrim"></div>
        <p class="overlay-input" style="pointer-events:none;bottom:28%">${esc(focus.text)}</p>
        <div class="nameplate is-in" data-od-id="author-nameplate"><span class="kicker">Auteur</span><strong>${esc(focus.name)}</strong></div>
      </div>` : "";
      return `<section class="fill" data-od-id="scores">
        <div class="strip" data-od-id="scores-strip">
          <span class="kicker">Tableau</span>
          <span class="round" style="font-family:var(--font-display);letter-spacing:.08em;text-transform:uppercase;font-size:14px">Manche ${state.round} / ${state.rounds} · somme des étoiles</span>
          <span class="spacer"></span>
          <span class="amber" data-od-id="scores-code">${esc(codeLabel())}</span>
        </div>
        <div class="board" data-od-id="scoreboard">${rows}</div>
        ${plate}
        <div class="spread" data-od-id="meme-spread">${stills}</div>
        <div class="cta-bar">
          <button class="btn btn-primary btn-wide" data-od-id="scores-cta" data-action="${last ? "over" : "next"}">${last ? "Nouvelle partie" : "Manche suivante"}</button>
        </div>
      </section>`;
    }

    function renderLibrary() {
      const items = state.library.map((it) => `<article class="lib-item" data-od-id="lib-item-${it.id}">
        <div class="thumb">${it.url ? `<img src="${esc(it.url)}" alt="${esc(it.title)}" width="800" height="500">` : it.svg}</div>
        <div class="lib-meta">
          <div>
            <div>${esc(it.title)}</div>
            <div class="tag">${it.synthetic ? "Synthétique" : "Import"} · ${it.kind === "gif" ? "GIF" : "Image"}</div>
          </div>
          <button type="button" class="btn btn-danger" data-od-id="remove-${it.id}" data-remove="${it.id}" aria-label="Retirer ${esc(it.title)}">${iconX()}</button>
        </div>
      </article>`).join("");
      return `<section class="fill" data-od-id="library">
        <div class="strip" data-od-id="library-strip">
          <span class="kicker">Bibliothèque</span>
          <span class="spacer"></span>
          <span class="amber">${esc(codeLabel())}</span>
        </div>
        <div class="pad fill">
          <p class="hint">Images et GIF du salon. Ce qui entre ici alimente le réservoir.</p>
          <div class="drop" data-od-id="library-drop" data-drop="1" style="margin:14px 0">Déposer ou importer un visuel</div>
          <input id="file" type="file" accept="image/*,image/gif" multiple hidden />
          <button type="button" class="btn btn-primary" data-od-id="import-files" data-action="pick">Importer</button>
          ${items ? `<div class="lib-grid" data-od-id="library-grid">${items}</div>` : `<div class="empty" data-od-id="library-empty">Le réservoir est vide. Dépose un visuel.</div>`}
          <button type="button" class="btn btn-ghost btn-wide" data-od-id="back-lobby" data-go="lobby">Retour au salon</button>
        </div>
      </section>`;
    }

    function render() {
      const map = { home: renderHome, lobby: renderLobby, caption: renderCaption, vote: renderVote, scores: renderScores, library: renderLibrary };
      $("stage").innerHTML = (map[state.view] || renderHome)();
      if (state.view === "lobby" && !state.isHost && !state.guestArmed) {
        state.guestArmed = true;
        setTimeout(() => { if (state.view === "lobby" && !state.isHost) go("caption"); }, 2200);
      }
    }

    function rerank() {
      if (reduce) return;
      const board = document.querySelector("[data-od-id='scoreboard']");
      if (!board) return;
      const rows = [...board.querySelectorAll(".row")];
      const first = new Map(rows.map((r) => [r, r.getBoundingClientRect()]));
      rows.sort((a, b) => Number(a.querySelector(".rank").textContent) - Number(b.querySelector(".rank").textContent));
      rows.forEach((r) => board.appendChild(r));
      rows.forEach((r) => {
        const last = r.getBoundingClientRect();
        const dy = first.get(r).top - last.top;
        if (Math.abs(dy) < 1) return;
        r.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 700, easing: "cubic-bezier(.2,.8,.2,1)" });
      });
    }

    function enter(ev) {
      if (ev) ev.preventDefault();
      const cta = homeCta();
      if (cta.disabled) return;
      const nick = state.nickname.trim();
      const c = state.code.trim().toUpperCase();
      state.nickname = nick;
      try { localStorage.setItem("mig-nick", nick); } catch (e) {}
      if (!c) {
        state.isHost = true;
        state.code = "BRNX";
      } else {
        state.isHost = false;
        state.code = c;
        state.guestArmed = false;
      }
      go("lobby");
    }

    function addFiles(files) {
      [...files].forEach((file) => {
        if (!file.type.startsWith("image/")) return;
        const url = URL.createObjectURL(file);
        state.library.push({
          id: "up-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
          kind: file.type === "image/gif" ? "gif" : "image",
          tag: "quotidien",
          title: file.name.replace(/\.[^.]+$/, ""),
          url,
          synthetic: false
        });
      });
      render();
    }

    function onClick(e) {
      const t = e.target.closest("[data-go],[data-action],[data-vote],[data-reveal],[data-remove],[data-drop]");
      if (!t) return;
      if (t.dataset.go) { go(t.dataset.go); return; }
      if (t.dataset.remove) {
        const id = t.dataset.remove;
        const item = state.library.find((x) => x.id === id);
        if (item && item.url) URL.revokeObjectURL(item.url);
        state.library = state.library.filter((x) => x.id !== id);
        render();
        return;
      }
      if (t.dataset.vote) {
        state.votes[t.dataset.vote] = Number(t.dataset.n);
        render();
        return;
      }
      if (t.dataset.reveal) {
        state.revealed = t.dataset.reveal;
        const stage = document.querySelector("[data-od-id='reveal-frame']");
        if (stage) stage.querySelectorAll("animate, animateTransform").forEach((a) => { try { a.endElement(); } catch (err) {} });
        render();
        return;
      }
      if (t.dataset.action === "enter") return;
      if (t.dataset.action === "start") {
        if (!pool().length) return;
        state.round = 1;
        state.matchOver = false;
        go("caption");
        return;
      }
      if (t.dataset.action === "send") {
        if (!state.draft.trim()) return;
        state.submitted = true;
        stopTimer();
        go("vote");
        return;
      }
      if (t.dataset.action === "confirm-votes") {
        if (!["marc", "ines", "yanis"].every((id) => state.votes[id])) return;
        go("scores");
        return;
      }
      if (t.dataset.action === "next") {
        state.round += 1;
        go("caption");
        return;
      }
      if (t.dataset.action === "over") {
        state.view = "home";
        state.matchOver = false;
        state.round = 1;
        render();
        return;
      }
      if (t.dataset.action === "pick") {
        const f = document.getElementById("file");
        if (f) f.click();
      }
    }

    function onInput(e) {
      const el = e.target;
      if (el.id === "nick") { state.nickname = el.value; const b = document.querySelector("[data-od-id='home-cta']"); if (b) { const c = homeCta(); b.disabled = c.disabled; b.textContent = c.label; } }
      if (el.id === "code") {
        el.value = el.value.replace(/[^a-zA-Z]/g, "").slice(0, 4).toUpperCase();
        state.code = el.value;
        const b = document.querySelector("[data-od-id='home-cta']");
        if (b) { const c = homeCta(); b.disabled = c.disabled; b.textContent = c.label; }
      }
      if (el.id === "cap") {
        state.draft = el.value;
        const b = document.querySelector("[data-od-id='send-caption']");
        if (b) b.disabled = !state.draft.trim();
      }
      if (el.id === "cat") { state.catalogue = el.value; render(); }
      if (el.id === "secs") state.captionSecs = Number(el.value);
      if (el.id === "rounds") state.rounds = Number(el.value);
    }

    function onChange(e) {
      if (e.target.id === "file" && e.target.files) addFiles(e.target.files);
    }

    const stage = $("stage");
    stage.addEventListener("click", onClick);
    stage.addEventListener("input", onInput);
    stage.addEventListener("change", onChange);
    stage.addEventListener("submit", enter);
    ["dragenter", "dragover"].forEach((ev) => {
      stage.addEventListener(ev, (e) => {
        const z = e.target.closest("[data-drop]");
        if (!z) return;
        e.preventDefault();
        z.classList.add("is-over");
      });
    });
    stage.addEventListener("dragleave", (e) => {
      const z = e.target.closest("[data-drop]");
      if (z) z.classList.remove("is-over");
    });
    stage.addEventListener("drop", (e) => {
      const z = e.target.closest("[data-drop]");
      if (!z) return;
      e.preventDefault();
      z.classList.remove("is-over");
      if (e.dataTransfer.files) addFiles(e.dataTransfer.files);
    });

    render();
  </script>
</body>
</html>
